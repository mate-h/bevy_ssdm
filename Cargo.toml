[package]
name = "bevy_ssdm"
version = "0.1.0"
edition = "2021"
description = "Screen-space displacement mapping (SSDM) for Bevy 0.18"
license = "MIT OR Apache-2.0"
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies]
bevy = { version = "0.18.1", default-features = true, features = [
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "jpeg",
    "png",
] }

[[example]]
name = "marble_sphere"
path = "examples/marble_sphere.rs"
